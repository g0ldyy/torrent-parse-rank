name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  criterion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: bench-weekly

      - name: Run ptt-core benchmark
        run: cargo bench -p ptt-core --bench ptt_bench -- --sample-size 10 --measurement-time 0.2 --warm-up-time 0.5

      - name: Run rtn-core benchmark
        run: cargo bench -p rtn-core --bench rtn_bench -- --sample-size 10 --measurement-time 0.2 --warm-up-time 0.5

      - name: Upload criterion artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-results
          path: |
            target/criterion/**/benchmark.json
            target/criterion/**/estimates.json
            target/criterion/**/sample.json
            target/criterion/**/tukey.json
          if-no-files-found: warn
